name: Keep Render warm

# Render's free plan sleeps a web service after ~15 min idle; the next visitor
# then eats a ~30-70s cold start. This pings the one lightweight public route
# (GET / -> "Hello World!") every ~10 min so the instance rarely sleeps.
#
# Caveats (not bugs): GitHub cron is best-effort and can run late or be skipped
# under load; GitHub auto-disables scheduled workflows after 60 days of repo
# inactivity; and this does NOT remove the brief blip during a deploy.

on:
  schedule:
    # ~every 10 min, offset off the :00 spike when everyone's crons fire.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://futurepath-api.onrender.com/ || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "no 200 after retries"; exit 1
