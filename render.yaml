# FuturePath AI — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# This declares the NestJS backend as a Docker web service. Render's own free
# database is PostgreSQL, but this app uses MySQL — so DATABASE_URL points at an
# external free MySQL (TiDB Cloud / Aiven). Secrets are marked sync:false and
# must be filled in from the Render dashboard, never committed here.

services:
  - type: web
    name: futurepath-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT automatically; the app reads process.env.PORT.

      # ── CORS ── comma-separated allowlist of frontend origins.
      # Set to your Cloudflare Pages URL, e.g.
      #   https://futurepath-ai.pages.dev,https://yourdomain.com
      - key: CORS_ORIGINS
        sync: false

      # ── Database ── external MySQL. mysql://user:pass@host:port/dbname
      - key: DATABASE_URL
        sync: false
      # TiDB Cloud / Aiven require TLS — set to "true" for those.
      - key: DATABASE_SSL
        value: "true"

      # ── AI provider ── active provider is OpenCodeZen.
      - key: OPENCODEZEN_API_KEY
        sync: false

      # ── Auth secrets ── generate strong random values in the dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d

      # ── Optional infra (off by default; memory-cache fallback) ──
      - key: ENABLE_REDIS
        value: "false"
      - key: ENABLE_BULLMQ
        value: "false"

      - key: LOG_LEVEL
        value: info
